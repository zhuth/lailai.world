<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello lailai world</title>
</head>
<body>
  <h1>Hello World!</h1>
  <script>
    // 探测本机是否能访问局域网：加载内网服务的图片
    // 成功 -> 跳转到内网导航页 au.dh.innovors.com；失败 -> 停留在本页（默认即 Hello World）
    (function () {
      var probe = new Image();
      probe.onload = function () {
        window.location.replace('https://au.dh.innovors.com');
      };
      // onerror 时无需处理：页面保持默认的 Hello World
      probe.onerror = function () {};
      // 加时间戳避免命中浏览器缓存，确保探测的是当前网络状态
      probe.src = 'https://searxng.lailai.world/static/themes/simple/img/favicon.png?t=' + Date.now();
    })();
  </script>
</body>
</html>
